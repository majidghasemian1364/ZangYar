name: Build ZangYar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZangYar project
        run: |
          mkdir -p build-project

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP project not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          unzip -q "$ZIP" -d build-project

          echo "Searching for Android project..."

          PROJECT=$(find build-project -type f -name "settings.gradle*" -o -type f -name "build.gradle*" | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "Android project directory not found"
            find build-project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Project directory: $PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Fix Java and Kotlin JVM targets
        run: |
          cat > "$GITHUB_WORKSPACE/fix-jvm.gradle" <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release = 17
              }

              tasks.configureEach { task ->
                  if (task.name.toLowerCase().contains("kotlin")) {
                      try {
                          task.kotlinOptions.jvmTarget = "17"
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
          EOF

          echo "JVM target fix created."

      - name: Build APK
        run: |
          gradle \
            -I "$GITHUB_WORKSPACE/fix-jvm.gradle" \
            -p "$PROJECT" \
            assembleDebug \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZangYar-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
